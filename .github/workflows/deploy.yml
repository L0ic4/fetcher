name: Deploy

# Build here, ship there. The VPS never runs a toolchain: it receives files and
# rebuilds a container. Verification is part of the deploy — a run is only green
# if the public URL answers 200 afterwards.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    # Le routeur (ops/ci-router.py) s'en sert pour rejouer ici un run que GitHub
    # n'a jamais démarré : gh workflow run ... -f runner=self-hosted
    inputs:
      runner:
        description: "label du runner (vide = variable CI_RUNNER)"
        required: false
        type: string

# One deploy at a time per repository: a second push waits instead of racing the
# first one over the same remote directory.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Ship to the VPS
    # Le runner est choisi par variable de dépôt : `CI_RUNNER=self-hosted` sur le
    # runner du VPS, `CI_RUNNER=ubuntu-latest` pour revenir au runner GitHub.
    # Variable absente = self-hosted (les minutes des dépôts privés sont épuisées).
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wire the deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY" || { echo "secret VPS_SSH_KEY is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ vars.VPS_PORT }}" -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host vps"
            echo "  HostName ${{ vars.VPS_HOST }}"
            echo "  Port ${{ vars.VPS_PORT }}"
            echo "  User ${{ vars.VPS_USER }}"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
          ssh vps 'echo "connected to $(hostname)"'


      - name: Build, ship, verify
        run: sh ./deploy.sh
